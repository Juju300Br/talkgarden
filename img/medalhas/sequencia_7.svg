<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Medalha: Sequência de 7 dias (jogar 7 dias seguidos) -->
  <!-- Fitas -->
  <polygon points="30,60 22,94 36,88 44,96 48,66" fill="#7B68C8"/>
  <polygon points="70,60 78,94 64,88 56,96 52,66" fill="#7B68C8"/>
  <!-- Medalha laranja -->
  <circle cx="50" cy="44" r="34" fill="#F39A4B"/>
  <circle cx="50" cy="44" r="26" fill="#FFC994"/>
  <!-- Calendário com o número 7 -->
  <rect x="36" y="30" width="28" height="28" rx="4" fill="#FFFFFF"/>
  <rect x="36" y="30" width="28" height="8" rx="3" fill="#E9557A"/>
  <rect x="41" y="26" width="3" height="7" rx="1.5" fill="#5B4BA6"/>
  <rect x="56" y="26" width="3" height="7" rx="1.5" fill="#5B4BA6"/>
  <text x="50" y="55" font-family="Nunito, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3D3D3D" text-anchor="middle">7</text>
</svg>
