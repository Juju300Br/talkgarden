<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Medalha bloqueada (cinza com cadeado).
       Serve para qualquer medalha que a criança ainda não ganhou. -->
  <!-- Fitas -->
  <polygon points="30,60 22,94 36,88 44,96 48,66" fill="#B5B0C6"/>
  <polygon points="70,60 78,94 64,88 56,96 52,66" fill="#B5B0C6"/>
  <!-- Medalha cinza -->
  <circle cx="50" cy="44" r="34" fill="#CFCBDC"/>
  <circle cx="50" cy="44" r="26" fill="#E4E1EC"/>
  <!-- Alça do cadeado -->
  <path d="M41 44 V37 A9 9 0 0 1 59 37 V44" stroke="#8E89A3" stroke-width="5" fill="none"/>
  <!-- Corpo do cadeado -->
  <rect x="36" y="42" width="28" height="22" rx="5" fill="#8E89A3"/>
  <!-- Buraco da chave -->
  <circle cx="50" cy="51" r="3" fill="#E4E1EC"/>
  <rect x="48.5" y="51" width="3" height="7" rx="1.5" fill="#E4E1EC"/>
</svg>
