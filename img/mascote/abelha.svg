<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <!-- Abelhinha mascote do TalkGarden -->

  <!-- Asas (azul-claro e um pouco transparentes) -->
  <ellipse cx="22" cy="66" rx="16" ry="22" fill="#BFE3F7" opacity="0.85" transform="rotate(-20 22 66)"/>
  <ellipse cx="78" cy="66" rx="16" ry="22" fill="#BFE3F7" opacity="0.85" transform="rotate(20 78 66)"/>

  <!-- Ferrão (triângulo escuro embaixo do corpo) -->
  <polygon points="46,112 54,112 50,120" fill="#2D2D2D"/>

  <!-- Corpo amarelo -->
  <ellipse cx="50" cy="84" rx="26" ry="30" fill="#F5B82E"/>

  <!-- Listras pretas do corpo -->
  <rect x="26" y="72" width="48" height="8" rx="4" fill="#2D2D2D"/>
  <rect x="27" y="88" width="46" height="8" rx="4" fill="#2D2D2D"/>
  <rect x="35" y="102" width="30" height="6" rx="3" fill="#2D2D2D"/>

  <!-- Antenas -->
  <path d="M42 22 Q38 12 33 8" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M58 22 Q62 12 67 8" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="33" cy="8" r="3.5" fill="#2D2D2D"/>
  <circle cx="67" cy="8" r="3.5" fill="#2D2D2D"/>

  <!-- Cabeça -->
  <circle cx="50" cy="40" r="22" fill="#F5B82E"/>

  <!-- Olhos (com um pontinho branco de brilho) -->
  <circle cx="42" cy="38" r="4" fill="#2D2D2D"/>
  <circle cx="58" cy="38" r="4" fill="#2D2D2D"/>
  <circle cx="43.3" cy="36.7" r="1.3" fill="#FFFFFF"/>
  <circle cx="59.3" cy="36.7" r="1.3" fill="#FFFFFF"/>

  <!-- Bochechas rosadas -->
  <ellipse cx="34" cy="47" rx="4" ry="3" fill="#F7A1B5"/>
  <ellipse cx="66" cy="47" rx="4" ry="3" fill="#F7A1B5"/>

  <!-- Sorriso -->
  <path d="M42 47 Q50 55 58 47" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
