<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Frase: "O pássaro voa alto" -->

  <!-- Fundo: só céu (o pássaro está lá no alto) -->
  <rect x="0" y="0" width="160" height="120" fill="#D6EEFB"/>

  <!-- Nuvenzinhas -->
  <rect x="14" y="20" width="40" height="12" rx="6" fill="#FFFFFF"/>
  <rect x="24" y="12" width="20" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="104" y="92" width="44" height="12" rx="6" fill="#FFFFFF"/>
  <rect x="116" y="84" width="22" height="14" rx="7" fill="#FFFFFF"/>

  <!-- Rabo -->
  <polygon points="58,62 38,50 40,72" fill="#5A9AD6"/>
  <!-- Corpo azul -->
  <ellipse cx="80" cy="62" rx="26" ry="17" fill="#7DB7EA"/>
  <!-- Cabeça -->
  <circle cx="104" cy="52" r="13" fill="#7DB7EA"/>
  <!-- Bico amarelo -->
  <polygon points="115,49 128,53 115,57" fill="#F5B82E"/>
  <!-- Olho -->
  <circle cx="107" cy="49" r="2.5" fill="#2D2D2D"/>
  <!-- Asa levantada (batendo) -->
  <path d="M68 58 Q62 28 92 38 Q86 52 80 62 Z" fill="#5A9AD6"/>
</svg>
