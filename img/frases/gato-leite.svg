<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Frase: "O gato bebe leite" -->

  <!-- Fundo: céu e chão -->
  <rect x="0" y="0" width="160" height="120" fill="#EAF6FF"/>
  <rect x="0" y="92" width="160" height="28" fill="#DFF0C8"/>

  <!-- Rabo do gato -->
  <path d="M36 90 Q16 80 24 60" stroke="#F39A4B" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Patas -->
  <rect x="42" y="94" width="9" height="16" rx="4" fill="#E07E2E"/>
  <rect x="68" y="94" width="9" height="16" rx="4" fill="#E07E2E"/>
  <!-- Corpo -->
  <ellipse cx="58" cy="88" rx="26" ry="15" fill="#F39A4B"/>
  <!-- Orelhas -->
  <polygon points="79,78 81,62 91,72" fill="#F39A4B"/>
  <polygon points="93,72 101,62 103,78" fill="#F39A4B"/>
  <!-- Cabeça (abaixada perto da tigela) -->
  <circle cx="91" cy="85" r="14" fill="#F39A4B"/>
  <!-- Olho fechado, feliz -->
  <path d="M91 83 Q94 80 97 83" stroke="#2D2D2D" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nariz -->
  <circle cx="104" cy="89" r="2.5" fill="#E9557A"/>

  <!-- Tigela roxa com leite branco -->
  <path d="M104 98 L140 98 Q138 112 122 112 Q106 112 104 98 Z" fill="#7B68C8"/>
  <ellipse cx="122" cy="98" rx="18" ry="4" fill="#FFFFFF"/>
</svg>
