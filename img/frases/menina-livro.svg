<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Frase: "A menina lê o livro" -->

  <!-- Fundo: céu e chão -->
  <rect x="0" y="0" width="160" height="120" fill="#EAF6FF"/>
  <rect x="0" y="92" width="160" height="28" fill="#DFF0C8"/>

  <!-- Cabelo de trás e as duas chiquinhas -->
  <circle cx="80" cy="36" r="17" fill="#5A3A22"/>
  <circle cx="60" cy="38" r="8" fill="#5A3A22"/>
  <circle cx="100" cy="38" r="8" fill="#5A3A22"/>

  <!-- Pernas -->
  <rect x="70" y="100" width="7" height="12" rx="3" fill="#F2C29B"/>
  <rect x="83" y="100" width="7" height="12" rx="3" fill="#F2C29B"/>
  <!-- Vestido rosa -->
  <polygon points="66,56 94,56 106,104 54,104" fill="#E9557A"/>

  <!-- Cabeça -->
  <circle cx="80" cy="38" r="14" fill="#F2C29B"/>
  <!-- Franja -->
  <path d="M66 35 A14 14 0 0 1 94 35 Q80 30 66 35 Z" fill="#5A3A22"/>
  <!-- Olhos olhando para baixo (lendo) e sorriso -->
  <path d="M73 41 Q75 43 77 41" stroke="#2D2D2D" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M83 41 Q85 43 87 41" stroke="#2D2D2D" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M76 46 Q80 49 84 46" stroke="#2D2D2D" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Livro aberto: capa roxa atrás e duas páginas brancas -->
  <polygon points="54,70 80,75 106,70 106,94 80,99 54,94" fill="#7B68C8"/>
  <polygon points="57,72 79,77 79,95 57,91" fill="#FFFFFF"/>
  <polygon points="81,77 103,72 103,91 81,95" fill="#FFFFFF"/>
  <!-- Linhas do texto -->
  <line x1="61" y1="79" x2="75" y2="82" stroke="#C9C3E6" stroke-width="2"/>
  <line x1="61" y1="85" x2="75" y2="88" stroke="#C9C3E6" stroke-width="2"/>
  <line x1="85" y1="82" x2="99" y2="79" stroke="#C9C3E6" stroke-width="2"/>
  <line x1="85" y1="88" x2="99" y2="85" stroke="#C9C3E6" stroke-width="2"/>
  <!-- Mãos segurando o livro -->
  <circle cx="56" cy="82" r="4" fill="#F2C29B"/>
  <circle cx="104" cy="82" r="4" fill="#F2C29B"/>
</svg>
