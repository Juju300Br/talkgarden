<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Frase: "O cachorro come o osso" -->

  <!-- Fundo: céu e chão -->
  <rect x="0" y="0" width="160" height="120" fill="#EAF6FF"/>
  <rect x="0" y="92" width="160" height="28" fill="#DFF0C8"/>

  <!-- Rabo -->
  <path d="M34 80 Q20 68 26 56" stroke="#C68B59" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Patas -->
  <rect x="40" y="90" width="9" height="18" rx="4" fill="#A9703F"/>
  <rect x="70" y="90" width="9" height="18" rx="4" fill="#A9703F"/>
  <!-- Corpo -->
  <ellipse cx="60" cy="84" rx="30" ry="15" fill="#C68B59"/>
  <!-- Cabeça -->
  <circle cx="92" cy="68" r="16" fill="#C68B59"/>
  <!-- Orelha caída -->
  <ellipse cx="84" cy="68" rx="6" ry="12" fill="#8B5A3C"/>
  <!-- Focinho, nariz e olho -->
  <ellipse cx="106" cy="76" rx="9" ry="7" fill="#EED3B5"/>
  <circle cx="113" cy="73" r="3.5" fill="#2D2D2D"/>
  <circle cx="95" cy="64" r="2.5" fill="#2D2D2D"/>

  <!-- Osso na boca do cachorro -->
  <rect x="104" y="80" width="30" height="7" rx="3" fill="#F5F0E6"/>
  <circle cx="134" cy="79" r="5" fill="#F5F0E6"/>
  <circle cx="134" cy="88" r="5" fill="#F5F0E6"/>
</svg>
