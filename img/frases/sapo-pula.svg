<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Frase: "O sapo pula no lago" -->

  <!-- Fundo: céu, chão e o lago -->
  <rect x="0" y="0" width="160" height="120" fill="#EAF6FF"/>
  <rect x="0" y="92" width="160" height="28" fill="#DFF0C8"/>
  <ellipse cx="80" cy="106" rx="60" ry="12" fill="#8CC8EC"/>
  <!-- Folha de vitória-régia -->
  <ellipse cx="56" cy="104" rx="16" ry="5" fill="#5AA845"/>

  <!-- Caminho do pulo (tracejado) -->
  <path d="M56 98 Q60 60 74 58" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="4 5" stroke-linecap="round"/>

  <!-- Pernas de trás esticadas -->
  <ellipse cx="74" cy="70" rx="14" ry="5" fill="#5AA845" transform="rotate(35 74 70)"/>
  <ellipse cx="80" cy="74" rx="14" ry="5" fill="#5AA845" transform="rotate(55 80 74)"/>
  <!-- Corpo -->
  <ellipse cx="94" cy="56" rx="20" ry="15" fill="#6BBF6B"/>
  <!-- Barriga mais clara -->
  <ellipse cx="96" cy="62" rx="12" ry="7" fill="#A8D88F"/>
  <!-- Olhos em cima da cabeça -->
  <circle cx="86" cy="40" r="7" fill="#6BBF6B"/>
  <circle cx="102" cy="40" r="7" fill="#6BBF6B"/>
  <circle cx="86" cy="40" r="4" fill="#FFFFFF"/>
  <circle cx="102" cy="40" r="4" fill="#FFFFFF"/>
  <circle cx="87" cy="40" r="2" fill="#2D2D2D"/>
  <circle cx="103" cy="40" r="2" fill="#2D2D2D"/>
  <!-- Sorriso -->
  <path d="M86 52 Q94 57 102 52" stroke="#2D2D2D" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Bracinhos para frente -->
  <line x1="108" y1="62" x2="118" y2="70" stroke="#5AA845" stroke-width="5" stroke-linecap="round"/>
</svg>
